# This is a basic workflow to help you get started with Actions

name: Nightly

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]

  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Builds BedethequeFetcher.exe. This must run on Windows: PyInstaller
  # packages for the OS it runs on, it cannot cross-compile a .exe from
  # Linux.
  build-fetcher:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: |
          pip install cloudscraper pyinstaller

      - name: Build BedethequeFetcher.exe
        run: |
          python build_fetcher.py

      - name: Run Python script
        id: get_filepath
        run: |
          echo "file_path=$(python CreatePlugin.py --ci)" >> $GITHUB_OUTPUT

      - name: Zipping files
        uses: montudor/action-zip@v1.0.0
        with:
          args: zip -q -j -r dir.zip src

      - name: Rename to crplugin
        run: |
          mv dir.zip '${{ steps.get_filepath.outputs.file_path }}'
          
      - name: Update git tag
        run: |
          git tag -f nightly
          git push -f origin nightly
          
      - name: Update Nightly Release
        uses: ncipollo/release-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ steps.get_filepath.outputs.file_path }}
          tag: "nightly"
          commit: main
          prerelease: true
          allowUpdates: true
          updateOnlyUnreleased: true
          removeArtifacts: true
