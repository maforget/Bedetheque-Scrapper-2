# This is a basic workflow to help you get started with Actions

name: Release

# Controls when the workflow will run
on:    
  workflow_dispatch:
      inputs:
        version:
          description: 'Version'
          required: true
          type: string
          default: 'X.Y{.Z}'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Builds BedethequeFetcher.exe. This must run on Windows: PyInstaller
  # packages for the OS it runs on, it cannot cross-compile a .exe from
  # Linux.
  build-fetcher:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: |
          pip install cloudscraper pyinstaller

      - name: Build BedethequeFetcher.exe
        run: |
          python build_fetcher.py

      # Runs a single command using the runners shell
      - name: Run Python script
        id: get_filepath
        run: |
          echo "file_path=$(python CreatePlugin.py --ci)" >> $GITHUB_OUTPUT

      - name: Zipping files
        uses: montudor/action-zip@v1.0.0
        with:
          args: zip -q -j -r dir.zip src

      - name: Rename to crplugin
        run: |
          mv dir.zip '${{ steps.get_filepath.outputs.file_path }}'
          
      - name: Update Nightly Release
        uses: ncipollo/release-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ steps.get_filepath.outputs.file_path }}
          allowUpdates: false
          artifactErrorsFailBuild: true
          draft: true
          prerelease: false
          commit: ${{ github.ref_name }}
          tag: 'v${{ github.event.inputs.version }}'
